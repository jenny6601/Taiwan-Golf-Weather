
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#103b31">
<title>離線模式｜Golf Weather</title>
<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f2f5f7;
  color: #17212b;
  display: grid;
  min-height: 100vh;
  place-items: center;
  text-align: center;
}
main {
  padding: 30px;
}
h1 { color: #126b4c; }
button {
  padding: 12px 24px;
  border: 0;
  border-radius: 10px;
  background: #126b4c;
  color: white;
  font-size: 16px;
}
</style>
</head>
<body>
<main>
  <h1>Golf Weather V32.2</h1>
  <h2>目前網路連線中斷</h2>
  <p>請確認網路連線後重新整理。</p>
  <p>離線期間無法更新即時天氣與預報。</p>
  <button onclick="location.reload()">
    重新連線
  </button>
</main>
</body>
</html>
