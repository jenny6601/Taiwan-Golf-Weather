name: V32.2 Scheduled Live Data Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v32-observation-collector.yml'
  schedule:
    # Use the existing scheduled workflow entry point that has already run successfully.
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: v32-2-live-publisher
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V32.2 feature branch and collector
        uses: actions/checkout@v4
        with:
          ref: feature/v32.2-57-course-live-observations
          path: source
          persist-credentials: false

      - name: Checkout main for isolated Pages publication
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: source/requirements.txt

      - name: Install dependencies
        run: pip install -r source/requirements.txt

      - name: Ingest CWA station observations into Supabase (Jiaoxi pilot)
        continue-on-error: true
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          cd source
          python -m scripts.collect_observations --source cwa

      - name: Build fresh CWA live snapshot for all 57 golf courses
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          cd source
          python -m scripts.build_live_observations

      - name: Verify snapshot and preview
        run: |
          test -s source/data/live_observations.json
          test -s source/v32.2-preview.html
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("source/data/live_observations.json").read_text(encoding="utf-8"))
          assert p.get("course_count")==57, f"Expected 57 courses, got {p.get('course_count')}"
          assert len(p.get("courses",{}))==57, "Snapshot course mapping is incomplete"
          assert p.get("generated_at"), "Snapshot generated_at is missing"
          coverage=p.get("coverage",{})
          assert coverage.get("weather_courses",0)>=50, f"Weather station coverage too low: {coverage}"
          assert coverage.get("rainfall_courses",0)>=50, f"Rainfall station coverage too low: {coverage}"
          print("Verified snapshot:", p["course_count"], "courses")
          print("CWA station coverage:", coverage)
          print("Generated at:", p["generated_at"])
          PY

      - name: Publish isolated V32.2 preview and public JSON
        run: |
          mkdir -p publish/data
          cp source/data/live_observations.json publish/data/live_observations.json
          cp source/v32.2-preview.html publish/v32.2-preview.html
          git -C publish config user.name "github-actions[bot]"
          git -C publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publish add data/live_observations.json v32.2-preview.html
          if git -C publish diff --cached --quiet; then
            echo "No public snapshot or preview changes."
          else
            git -C publish commit -m "Publish V32.2 live observations and isolated preview"
            for attempt in 1 2 3; do
              git -C publish fetch origin main
              git -C publish rebase origin/main
              if git -C publish push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            echo "Failed to publish live CWA snapshot after three attempts."
            exit 1
          fi
