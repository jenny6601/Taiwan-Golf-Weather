name: V32.2 Forecast Cache Builder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v32.2-forecast-cache.yml'
      - 'scripts/build_forecast_cache.py'
  schedule:
    - cron: "25 * * * *"

permissions:
  contents: write

concurrency:
  group: v32-2-forecast-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout V32.2 preview
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build 57-course, six-model forecast cache
        run: python scripts/build_forecast_cache.py
      - name: Publish forecast cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast_cache.json
          if git diff --cached --quiet; then
            echo "Forecast cache unchanged."
          else
            git commit -m "Update V32.2 nationwide forecast cache"
            git push
          fi
